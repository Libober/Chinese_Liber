<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Тренажёр китайских иероглифов</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- React & ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  
  <!-- Babel для компиляции JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Dexie.js (IndexedDB) -->
  <script src="https://unpkg.com/dexie@3.2.4/dist/dexie.js"></script>
  
  <!-- Mammoth.js (Парсер DOCX) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  
  <!-- Hanzi Writer (Рисование иероглифов) -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const ACTIVE_SESSION_KEY = 'CHINESE_TRAINER_ACTIVE_SESSION';
    const LOCAL_STORAGE_KEY = 'CHINESE_TRAINER_BACKUP_V1';

    // --- 1. БАЗА ДАННЫХ (Dexie.js) ---
    const db = new Dexie('ChineseTrainerDB');
    db.version(1).stores({
      words: '++id, group, hanzi',
      sentences: '++id, correctHanzi, wordId',
      progress: 'wordId, lastTested',
    });

    // Утилита перемешивания массива (Fisher-Yates)
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // Утилита очистки примера "(например...)" из текста задания (Правка 3)
    function cleanMeaningForQuestion(meaning) {
      if (!meaning) return '';
      return meaning.replace(/\s*\(например.*?\)/gi, '').trim();
    }

    // Функция выбора дистракторов с приоритетом той же темы (Правка 5)
    function getDistractors(targetWord, allWords) {
      const sameGroup = allWords.filter((w) => w.group === targetWord.group && w.hanzi !== targetWord.hanzi);
      const otherGroup = allWords.filter((w) => w.group !== targetWord.group && w.hanzi !== targetWord.hanzi);

      const shuffledSame = shuffleArray(sameGroup);
      const shuffledOther = shuffleArray(otherGroup);

      const combined = [...shuffledSame, ...shuffledOther];
      return combined.slice(0, 3);
    }

    async function backupToLocalStorage() {
      try {
        const words = await db.words.toArray();
        const sentences = await db.sentences.toArray();
        const progress = await db.progress.toArray();
        localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify({ timestamp: Date.now(), words, sentences, progress }));
      } catch (e) {
        console.error('Ошибка бэкапа:', e);
      }
    }

    async function restoreFromLocalStorage() {
      const raw = localStorage.getItem(LOCAL_STORAGE_KEY);
      if (!raw) return false;
      try {
        const backup = JSON.parse(raw);
        await db.transaction('rw', [db.words, db.sentences, db.progress], async () => {
          if (backup.words?.length) { await db.words.clear(); await db.words.bulkAdd(backup.words); }
          if (backup.sentences?.length) { await db.sentences.clear(); await db.sentences.bulkAdd(backup.sentences); }
          if (backup.progress?.length) { await db.progress.clear(); await db.progress.bulkPut(backup.progress); }
        });
        return true;
      } catch (e) {
        console.error('Ошибка восстановления:', e);
        return false;
      }
    }

    async function exportDataToJSON() {
      const words = await db.words.toArray();
      const sentences = await db.sentences.toArray();
      const progress = await db.progress.toArray();
      const blob = new Blob([JSON.stringify({ words, sentences, progress }, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `chinese_trainer_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    async function importDataFromJSON(file) {
      try {
        const text = await file.text();
        const data = JSON.parse(text);
        await db.transaction('rw', [db.words, db.sentences, db.progress], async () => {
          if (Array.isArray(data.words)) { await db.words.clear(); await db.words.bulkAdd(data.words); }
          if (Array.isArray(data.sentences)) { await db.sentences.clear(); await db.sentences.bulkAdd(data.sentences); }
          if (Array.isArray(data.progress)) { await db.progress.clear(); await db.progress.bulkPut(data.progress); }
        });
        await backupToLocalStorage();
        return true;
      } catch (e) {
        console.error('Ошибка импорта:', e);
        return false;
      }
    }

    // --- 2. ПАРСИНГ DOCX ---
    async function parseWordsDocx(file) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      const parser = new DOMParser();
      const doc = parser.parseFromString(result.value, 'text/html');

      const wordsToInsert = [];
      let currentGroup = 'Общая';
      const bodyElements = Array.from(doc.body.children);

      for (const el of bodyElements) {
        const text = el.textContent?.trim() || '';
        if (['H1', 'H2', 'H3', 'P'].includes(el.tagName)) {
          if (/^\d+\s+/.test(text) || text.includes('Семья') || text.includes('Числа') || text.includes('Страны')) {
            currentGroup = text;
          }
        }
        if (el.tagName === 'TABLE') {
          const rows = Array.from(el.querySelectorAll('tr'));
          for (const row of rows) {
            const cells = Array.from(row.querySelectorAll('td, th')).map((c) => c.textContent?.trim() || '');
            if (cells.length >= 3) {
              const [hanzi, pinyin, meaning] = cells;
              if (hanzi && hanzi !== 'Иероглиф' && !hanzi.includes('Справочник')) {
                wordsToInsert.push({ group: currentGroup, hanzi, pinyin, meaning });
              }
            }
          }
        }
      }

      if (wordsToInsert.length > 0) {
        await db.words.clear();
        await db.words.bulkAdd(wordsToInsert);
        await backupToLocalStorage();
      }
      return wordsToInsert.length;
    }

    async function parseSentencesDocx(file) {
      const arrayBuffer = await file.arrayBuffer();
      const result = await mammoth.convertToHtml({ arrayBuffer });
      const parser = new DOMParser();
      const doc = parser.parseFromString(result.value, 'text/html');

      const allWords = await db.words.toArray();
      const wordMap = new Map();
      allWords.forEach((w) => { if (w.id) wordMap.set(w.hanzi, w); });

      const sentencesToInsert = [];
      const elements = Array.from(doc.body.querySelectorAll('p, tr, li, h1, h2, h3, h4'));
      let currentWord = null;

      for (const el of elements) {
        const rawText = el.textContent?.trim() || '';
        if (!rawText) continue;

        const parts = rawText.split('—').map((s) => s.trim());
        if (parts.length >= 2) {
          const possibleHanzi = parts[0].trim();
          if (wordMap.has(possibleHanzi)) {
            currentWord = wordMap.get(possibleHanzi);
            continue;
          }
        }

        if (rawText.includes('—') && (rawText.includes('(') || rawText.includes('__'))) {
          let sentenceText = '';
          let sentencePinyin = '';
          let sentenceTranslation = '';

          const lastDashIdx = rawText.lastIndexOf('—');
          if (lastDashIdx !== -1) {
            sentenceTranslation = rawText.substring(lastDashIdx + 1).trim();
            const beforeDash = rawText.substring(0, lastDashIdx).trim();

            const matchPinyin = beforeDash.match(/\((.*?)\)/);
            if (matchPinyin) {
              sentencePinyin = matchPinyin[1].trim();
              sentenceText = beforeDash.replace(/\(.*?\)/, '').trim();
            } else {
              sentenceText = beforeDash;
            }
          } else {
            sentenceText = rawText;
          }

          if (!sentenceText.includes('__')) {
            if (currentWord && sentenceText.includes(currentWord.hanzi)) {
              sentenceText = sentenceText.replace(currentWord.hanzi, '__');
            } else {
              sentenceText = '__' + sentenceText;
            }
          }

          let targetHanzi = currentWord ? currentWord.hanzi : '';
          if (!targetHanzi) {
            for (const [h, wObj] of wordMap.entries()) {
              if (rawText.includes(h)) {
                targetHanzi = h;
                currentWord = wObj;
                break;
              }
            }
          }

          if (targetHanzi) {
            const wordObj = wordMap.get(targetHanzi);
            sentencesToInsert.push({
              text: sentenceText,
              pinyin: sentencePinyin,
              translation: sentenceTranslation,
              correctHanzi: targetHanzi,
              wordId: wordObj ? wordObj.id : undefined,
            });
          }
        }
      }

      if (sentencesToInsert.length === 0) {
        const rows = Array.from(doc.querySelectorAll('tr'));
        for (const row of rows) {
          const cells = Array.from(row.querySelectorAll('td')).map((c) => c.textContent?.trim() || '');
          if (cells.length >= 2) {
            const [sText, targetHanzi] = cells;
            if (sText.includes('__')) {
              const wordObj = wordMap.get(targetHanzi.trim());
              sentencesToInsert.push({
                text: sText,
                pinyin: '',
                translation: '',
                correctHanzi: targetHanzi.trim(),
                wordId: wordObj ? wordObj.id : undefined,
              });
            }
          }
        }
      }

      if (sentencesToInsert.length > 0) {
        await db.sentences.clear();
        await db.sentences.bulkAdd(sentencesToInsert);
        await backupToLocalStorage();
      }
      return sentencesToInsert.length;
    }

    // --- 3. КОМПОНЕНТЫ ИНТЕРФЕЙСА ---

    function StrokeWarningModal({ hanzi, onSkip, onDrawWithoutCheck }) {
      return (
        <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-sm">
          <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl text-center">
            <div className="w-12 h-12 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">⚠️</div>
            <h3 className="text-lg font-bold text-gray-900 mb-2">Данные о чертах не найдены</h3>
            <p className="text-sm text-gray-600 mb-6">
              Для иероглифа <span className="font-bold text-indigo-600 text-base">{hanzi}</span> нет готовой схемы порядка черт.
            </p>
            <div className="flex flex-col gap-2">
              <button onClick={onDrawWithoutCheck} className="w-full py-3 bg-indigo-600 text-white rounded-xl text-sm font-semibold hover:bg-indigo-700 transition">
                Рисовать без проверки
              </button>
              <button onClick={onSkip} className="w-full py-3 bg-gray-100 text-gray-700 rounded-xl text-sm font-semibold hover:bg-gray-200 transition">
                Пропустить иероглиф
              </button>
            </div>
          </div>
        </div>
      );
    }

    function WritingQuiz({ question, isLocked, savedAnswer, onAnswer, onSkip, onNext, onPrev, isFirstQuestion }) {
      const { word } = question;
      const containerRef = useRef(null);
      const writerRef = useRef(null);
      const [loading, setLoading] = useState(true);
      const [showWarningModal, setShowWarningModal] = useState(false);
      const [freeDrawMode, setFreeDrawMode] = useState(false);
      const [isDone, setIsDone] = useState(!!savedAnswer);

      useEffect(() => {
        if (!containerRef.current) return;
        containerRef.current.innerHTML = '';
        setLoading(true);
        setFreeDrawMode(false);
        setIsDone(!!savedAnswer);

        const targetChar = word.hanzi[0];

        try {
          const writer = HanziWriter.create(containerRef.current, targetChar, {
            width: 240,
            height: 240,
            padding: 15,
            showOutline: true,
            strokeAnimationSpeed: 1,
            delayBetweenStrokes: 200,
            onLoadCharDataError: () => {
              setLoading(false);
              setShowWarningModal(true);
            },
            onLoadCharDataSuccess: () => {
              setLoading(false);
              if (!isLocked && !savedAnswer) {
                writer.quiz({
                  onComplete: (summary) => {
                    writer.animateCharacter({
                      onComplete: () => {
                        setIsDone(true);
                        onAnswer('stroke', summary.totalMistakes === 0);
                      },
                    });
                  },
                });
              }
            },
          });
          writerRef.current = writer;
        } catch (e) {
          setLoading(false);
          setShowWarningModal(true);
        }
      }, [word, isLocked, savedAnswer]);

      return (
        <div className="flex flex-col items-center w-full max-w-md bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
          <div className="text-center mb-4">
            <span className="text-xs text-slate-400 font-bold uppercase tracking-wider">Напишите иероглиф</span>
            <h2 className="text-3xl font-extrabold text-slate-800 my-1">{cleanMeaningForQuestion(word.meaning)}</h2>
            <p className="text-lg text-indigo-600 font-medium">{word.pinyin}</p>
          </div>

          <div className="relative border-2 border-dashed border-indigo-200 rounded-2xl p-3 bg-slate-50 mb-4">
            {loading && <div className="p-12 text-slate-400 text-sm">Загрузка черт...</div>}
            <div ref={containerRef} className={freeDrawMode ? 'hidden' : 'block'} />

            {freeDrawMode && (
              <div className="w-[240px] h-[240px] flex flex-col items-center justify-center bg-white rounded-xl">
                <p className="text-xs text-slate-400 mb-4">Свободный режим</p>
                <button onClick={() => { setIsDone(true); onAnswer('stroke', true); }} className="px-4 py-2 bg-emerald-500 text-white rounded-lg text-sm font-semibold shadow-md">
                  Засчитать как верно
                </button>
              </div>
            )}
          </div>

          {/* Кнопка Назад и Пропустить на одном уровне (Правка 2) */}
          <div className="w-full flex items-center justify-between gap-2 mt-2">
            <button
              onClick={onPrev}
              disabled={isFirstQuestion}
              className="py-2.5 px-4 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 text-xs font-semibold disabled:opacity-30 disabled:cursor-not-allowed transition"
            >
              ← Назад
            </button>
            {!isDone && !isLocked && (
              <button onClick={onSkip} className="py-2.5 px-4 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 text-xs font-semibold transition">
                ⏩ Пропустить
              </button>
            )}
          </div>

          {isDone && (
            <div className="w-full mt-4 p-4 rounded-2xl bg-emerald-50 border-l-4 border-emerald-500">
              <div className="font-bold text-emerald-800 text-base mb-1">Выполнено!</div>
              <div className="text-sm text-slate-600 mb-3">
                Иероглиф: <strong className="font-serif text-lg text-slate-800">{word.hanzi}</strong> ({word.pinyin}) — {word.meaning}
              </div>
              <button onClick={onNext} className="w-full py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition">
                Следующее задание →
              </button>
            </div>
          )}

          {showWarningModal && (
            <StrokeWarningModal
              hanzi={word.hanzi}
              onSkip={() => { setShowWarningModal(false); onSkip(); }}
              onDrawWithoutCheck={() => { setShowWarningModal(false); setFreeDrawMode(true); }}
            />
          )}
        </div>
      );
    }

    function MemorizationQuiz({ question, isLocked, savedAnswer, onAnswer, onSkip, onNext, onPrev, isFirstQuestion }) {
      const { word, quizType, sentence, options, distractors } = question;
      const [selectedOption, setSelectedOption] = useState(savedAnswer || null);

      useEffect(() => {
        setSelectedOption(savedAnswer || null);
      }, [question, savedAnswer]);

      const handleSelect = (optionHanzi) => {
        if (selectedOption || isLocked) return;
        setSelectedOption(optionHanzi);
        const isCorrect = (optionHanzi === word.hanzi);
        onAnswer(optionHanzi, isCorrect);
      };

      const isAnswered = selectedOption !== null;
      const isCorrect = selectedOption === word.hanzi;

      const cleanSentenceText = sentence ? sentence.text : '这是__。';

      return (
        <div className="w-full max-w-lg bg-white p-6 rounded-2xl shadow-xl border border-slate-100">
          {/* Шапка задания (Правка 3: без примеров "например...") */}
          <div className="text-center mb-6">
            <span className="text-xs text-slate-400 font-bold uppercase tracking-wider">
              {quizType === 'choice' ? 'Выберите иероглиф' : 'Вставьте пропущенный иероглиф'}
            </span>

            {quizType === 'choice' ? (
              <h2 className="text-3xl font-extrabold text-slate-800 mt-2">{cleanMeaningForQuestion(word.meaning)}</h2>
            ) : (
              <h2 className="text-2xl font-serif font-semibold text-slate-800 mt-3 p-4 bg-slate-50 rounded-xl border border-slate-100">
                {cleanSentenceText}
              </h2>
            )}
          </div>

          {/* Варианты ответов (иероглифы) */}
          <div className="grid grid-cols-2 gap-3 mb-4">
            {options.map((opt) => {
              let btnStyle = "border-slate-200 bg-white hover:border-indigo-400 text-slate-800";
              let circleStyle = "border-slate-300";
              let icon = null;

              if (isAnswered) {
                if (opt.hanzi === word.hanzi) {
                  btnStyle = "border-emerald-500 bg-emerald-50 text-emerald-800 font-bold shadow-sm";
                  circleStyle = "border-emerald-500 bg-emerald-500 text-white";
                  icon = "✓";
                } else if (opt.hanzi === selectedOption) {
                  btnStyle = "border-rose-500 bg-rose-50 text-rose-800 font-bold shadow-sm";
                  circleStyle = "border-rose-500 bg-rose-500 text-white";
                  icon = "✕";
                } else {
                  btnStyle = "border-slate-100 bg-slate-50 text-slate-400 opacity-60";
                }
              }

              return (
                <button
                  key={opt.hanzi}
                  disabled={isAnswered || isLocked}
                  onClick={() => handleSelect(opt.hanzi)}
                  className={`p-4 rounded-xl border-2 transition-all flex items-center justify-between text-2xl font-serif ${btnStyle}`}
                >
                  <span>{opt.hanzi}</span>
                  <span className={`w-6 h-6 rounded-full border flex items-center justify-center text-xs font-sans ${circleStyle}`}>
                    {icon}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Кнопка Назад слева и Пропустить справа внизу карточки (Правка 2) */}
          <div className="flex items-center justify-between gap-2 mt-2">
            <button
              onClick={onPrev}
              disabled={isFirstQuestion}
              className="py-2.5 px-4 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 text-xs font-semibold disabled:opacity-30 disabled:cursor-not-allowed transition"
            >
              ← Назад
            </button>

            {!isAnswered && !isLocked && (
              <button onClick={onSkip} className="py-2.5 px-4 bg-slate-100 text-slate-600 rounded-xl hover:bg-slate-200 text-xs font-semibold transition">
                ⏩ Пропустить
              </button>
            )}
          </div>

          {/* Блок результата и разбора ответа (Правки 1 и 3) */}
          {isAnswered && (
            <div className={`mt-6 p-4 rounded-2xl border-l-4 ${
              isCorrect ? 'bg-emerald-50/80 border-emerald-500' : 'bg-rose-50/80 border-rose-500'
            }`}>
              <div className="font-bold text-lg mb-3 flex items-center gap-2">
                {isCorrect ? (
                  <span className="text-emerald-700">✓ Верно (1 балл)</span>
                ) : (
                  <span className="text-rose-700">✕ Неверно (0 баллов)</span>
                )}
              </div>

              <div className="bg-white p-4 rounded-xl shadow-sm border border-slate-100 space-y-3 text-sm">
                <div>
                  <span className="font-bold text-emerald-700">Правильный ответ: </span>
                  <span className="font-serif text-lg font-bold">{word.hanzi}</span>
                  <span className="text-indigo-600 font-medium ml-1">({word.pinyin})</span>
                  <span className="text-slate-600"> — {word.meaning}</span>
                </div>

                {/* Вывод иероглифов, пиньиня предложения и перевода (Правка 1) */}
                {quizType === 'sentence' && sentence && (
                  <div className="p-3 bg-slate-50 rounded-lg text-slate-700 border border-slate-100 space-y-1">
                    <span className="font-bold text-xs text-slate-400 block mb-1">Итоговое предложение:</span>
                    <div className="font-serif text-lg text-slate-800 font-medium">
                      {sentence.text ? sentence.text.replace('__', word.hanzi) : word.hanzi}
                    </div>
                    {sentence.pinyin && (
                      <div className="text-sm text-indigo-600 font-medium">
                        {sentence.pinyin.includes('__') ? sentence.pinyin.replace('__', word.pinyin) : `${sentence.pinyin} (${word.pinyin})`}
                      </div>
                    )}
                    {sentence.translation && (
                      <div className="text-sm text-slate-600 italic">
                        — {sentence.translation}
                      </div>
                    )}
                  </div>
                )}

                <div className="border-t border-slate-100 pt-3">
                  <span className="font-bold text-rose-700 text-xs block mb-1.5">Не подходят варианты:</span>
                  <ul className="space-y-1.5 text-xs text-slate-600">
                    {distractors.map((d) => (
                      <li key={d.hanzi} className="flex items-center gap-1.5">
                        <span className="font-serif font-bold text-slate-800 text-sm">{d.hanzi}</span>
                        <span className="text-indigo-600">({d.pinyin})</span>
                        <span className="text-slate-500">— {d.meaning}</span>
                      </li>
                    ))}
                  </ul>
                </div>
              </div>

              <button
                onClick={onNext}
                className="w-full mt-4 py-3 bg-indigo-600 text-white font-bold rounded-xl shadow hover:bg-indigo-700 transition"
              >
                Следующее задание →
              </button>
            </div>
          )}
        </div>
      );
    }

    function GroupList({
      groups,
      words,
      hasActiveSession,
      savedSessionInfo,
      onUploadWords,
      onUploadSentences,
      onStartTraining,
      onResumeSession,
      onClearSession,
      onExport,
      onImport,
    }) {
      return (
        <div className="max-w-4xl mx-auto p-4 space-y-6">
          {/* Блок незавершенной сессии */}
          {hasActiveSession && savedSessionInfo && (
            <div className="bg-amber-50 border-2 border-amber-300 rounded-2xl p-4 flex flex-col sm:flex-row items-center justify-between gap-4 shadow-sm">
              <div className="text-amber-900">
                <h3 className="font-bold text-base flex items-center gap-2">
                  <span>⚠️</span> Найдена неоконченная тренировка!
                </h3>
                <p className="text-xs text-amber-700 mt-1">
                  Группа: <strong className="font-semibold">{savedSessionInfo.groupId === 'all' ? 'Все слова' : savedSessionInfo.groupId}</strong> | 
                  Прогресс: <strong className="font-semibold">{savedSessionInfo.currentIndex + 1}</strong> из {savedSessionInfo.questions.length}
                </p>
              </div>
              <div className="flex items-center gap-2 w-full sm:w-auto">
                <button
                  onClick={onResumeSession}
                  className="flex-1 sm:flex-none px-4 py-2.5 bg-amber-600 text-white rounded-xl text-xs font-bold hover:bg-amber-700 transition"
                >
                  ▶️ Продолжить
                </button>
                <button
                  onClick={onClearSession}
                  className="flex-1 sm:flex-none px-3 py-2.5 bg-amber-100 text-amber-800 rounded-xl text-xs font-semibold hover:bg-amber-200 transition"
                >
                  🗑️ Сбросить
                </button>
              </div>
            </div>
          )}

          {/* Загрузка документов */}
          <div className="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h1 className="text-2xl font-black text-slate-800 mb-4">Тренажёр китайских иероглифов</h1>
            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
              <label className="flex items-center justify-center gap-3 p-4 border-2 border-dashed border-indigo-200 rounded-xl hover:bg-indigo-50/50 cursor-pointer transition">
                <span className="text-xl">📁</span>
                <span className="text-sm font-semibold text-slate-700">Загрузить слова (.docx)</span>
                <input type="file" accept=".docx" onChange={onUploadWords} className="hidden" />
              </label>

              <label className="flex items-center justify-center gap-3 p-4 border-2 border-dashed border-emerald-200 rounded-xl hover:bg-emerald-50/50 cursor-pointer transition">
                <span className="text-xl">📝</span>
                <span className="text-sm font-semibold text-slate-700">Загрузить предложения (.docx)</span>
                <input type="file" accept=".docx" onChange={onUploadSentences} className="hidden" />
              </label>
            </div>

            <div className="flex gap-4 mt-4 pt-4 border-t border-slate-100 text-xs text-slate-500 justify-between items-center">
              <span>Всего слов в базе: <strong className="text-slate-800">{words.length}</strong></span>
              <div className="flex gap-3">
                <button onClick={onExport} className="hover:text-indigo-600">📥 Экспорт JSON</button>
                <label className="hover:text-indigo-600 cursor-pointer">
                  📤 Импорт JSON
                  <input type="file" accept=".json" onChange={onImport} className="hidden" />
                </label>
              </div>
            </div>
          </div>

          {/* Сообщение об отсутствии данных (Правка 6) */}
          {words.length === 0 && (
            <div className="bg-indigo-50 border border-indigo-100 rounded-2xl p-6 text-center text-indigo-900">
              <span className="text-3xl block mb-2">📚</span>
              <h2 className="font-bold text-lg mb-1">База данных пуста</h2>
              <p className="text-sm text-indigo-700 max-w-md mx-auto">
                Загрузите файлы <strong>.docx</strong> со словами и предложениями с помощью кнопок выше, чтобы сформировать группы и начать обучение.
              </p>
            </div>
          )}

          {/* Общие кнопки */}
          {words.length > 0 && (
            <div className="flex flex-col sm:flex-row gap-3">
              <button onClick={() => onStartTraining('all', 'writing')} className="flex-1 py-4 bg-indigo-600 text-white rounded-xl font-bold shadow-lg hover:bg-indigo-700 transition">
                ▶️ Написание (Все слова)
              </button>
              <button onClick={() => onStartTraining('all', 'choice')} className="flex-1 py-4 bg-emerald-600 text-white rounded-xl font-bold shadow-lg hover:bg-emerald-700 transition">
                ▶️ Тестирование (Все слова)
              </button>
            </div>
          )}

          {/* Группы */}
          {words.length > 0 && (
            <div className="space-y-3">
              <h2 className="text-lg font-bold text-slate-800">Группы слов</h2>
              {groups.map((group, i) => (
                <div key={i} className="bg-white p-4 rounded-xl border border-slate-100 flex items-center justify-between shadow-sm">
                  <div>
                    <h3 className="font-bold text-slate-800">{group.name}</h3>
                    <p className="text-xs text-slate-400">{group.count} слов(а)</p>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={() => onStartTraining(group.name, 'writing')} className="px-3 py-2 bg-indigo-50 text-indigo-600 rounded-lg text-xs font-bold hover:bg-indigo-100">
                      Письмо
                    </button>
                    <button onClick={() => onStartTraining(group.name, 'choice')} className="px-3 py-2 bg-emerald-50 text-emerald-600 rounded-lg text-xs font-bold hover:bg-emerald-100">
                      Тест
                    </button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </div>
      );
    }

    function SessionSummary({ questions, answers, onRestart }) {
      const [expandedIndex, setExpandedIndex] = useState(null);

      const correctCount = answers.filter((a) => a.isCorrect).length;
      const total = answers.length;
      const percentage = Math.round((correctCount / (total || 1)) * 100);

      return (
        <div className="max-w-2xl mx-auto p-6 bg-white rounded-2xl shadow-xl my-8">
          <div className="text-center mb-6">
            <h2 className="text-2xl font-black text-slate-800 mb-2">Сессия завершена!</h2>
            <div className="text-5xl font-extrabold text-indigo-600 my-4">{percentage}%</div>
            <p className="text-sm text-slate-500">
              Правильно: <strong className="text-emerald-600">{correctCount}</strong> из {total}
            </p>
          </div>

          <div className="space-y-3 mb-6">
            <h3 className="text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">
              Детализация ответов (нажмите для разбора):
            </h3>
            {questions.map((q, idx) => {
              const ans = answers.find((a) => a.questionIndex === idx);
              const isCorrect = ans?.isCorrect;
              const isExpanded = expandedIndex === idx;

              return (
                <div
                  key={idx}
                  className={`rounded-xl border transition-all overflow-hidden ${
                    isCorrect ? 'border-emerald-200 bg-emerald-50/30' : 'border-rose-200 bg-rose-50/30'
                  }`}
                >
                  <button
                    onClick={() => setExpandedIndex(isExpanded ? null : idx)}
                    className="w-full p-4 flex items-center justify-between text-left focus:outline-none"
                  >
                    <div className="flex items-center gap-3">
                      <span className={`w-7 h-7 rounded-full flex items-center justify-center font-bold text-xs ${
                        isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                      }`}>
                        {idx + 1}
                      </span>
                      <div>
                        <span className="font-serif font-bold text-lg text-slate-800 mr-2">{q.word.hanzi}</span>
                        <span className="text-xs text-slate-500">({q.word.pinyin}) — {q.word.meaning}</span>
                      </div>
                    </div>

                    <div className="flex items-center gap-2">
                      <span className={`text-xs font-bold px-2.5 py-1 rounded-full ${
                        isCorrect ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'
                      }`}>
                        {isCorrect ? '✓ Верно' : '✕ Ошибка'}
                      </span>
                      <span className="text-slate-400 font-bold text-xs">{isExpanded ? '▲' : '▼'}</span>
                    </div>
                  </button>

                  {isExpanded && (
                    <div className="p-4 bg-white border-t border-slate-100 text-sm space-y-3">
                      {q.quizType === 'sentence' && q.sentence ? (
                        <div className="bg-slate-50 p-3 rounded-lg border border-slate-100 space-y-1">
                          <span className="text-xs text-slate-400 font-semibold block">Итоговое предложение:</span>
                          <div className="font-serif text-base text-slate-800 font-bold">
                            {q.sentence.text ? q.sentence.text.replace('__', q.word.hanzi) : q.word.hanzi}
                          </div>
                          {q.sentence.pinyin && (
                            <div className="text-xs text-indigo-600 font-medium">
                              {q.sentence.pinyin.includes('__') ? q.sentence.pinyin.replace('__', q.word.pinyin) : q.sentence.pinyin}
                            </div>
                          )}
                          {q.sentence.translation && (
                            <div className="text-xs text-slate-600 italic">
                              — {q.sentence.translation}
                            </div>
                          )}
                        </div>
                      ) : (
                        <div>
                          <span className="text-xs text-slate-400 font-semibold block">Задание (значение слова):</span>
                          <p className="font-bold text-slate-800 bg-slate-50 p-2 rounded border border-slate-100 mt-1">
                            {q.word.meaning}
                          </p>
                        </div>
                      )}

                      <div className="grid grid-cols-2 gap-2 text-xs">
                        <div className="p-2.5 rounded bg-slate-50 border border-slate-100">
                          <span className="text-slate-400 block font-medium">Ваш ответ:</span>
                          <span className={`font-serif font-bold text-base ${isCorrect ? 'text-emerald-600' : 'text-rose-600'}`}>
                            {ans?.userAnswer === 'skip' ? 'Пропущено' : (ans?.userAnswer || '—')}
                          </span>
                        </div>
                        <div className="p-2.5 rounded bg-emerald-50 border border-emerald-100">
                          <span className="text-emerald-700 block font-medium">Правильный ответ:</span>
                          <span className="font-serif font-bold text-base text-emerald-700">
                            {q.word.hanzi} ({q.word.pinyin})
                          </span>
                        </div>
                      </div>

                      {q.options && (
                        <div className="pt-2 border-t border-slate-100">
                          <span className="text-xs font-bold text-slate-500 block mb-1">Все варианты ответа:</span>
                          <ul className="space-y-1 text-xs text-slate-600">
                            {q.options.map((opt) => (
                              <li key={opt.hanzi} className="flex items-center gap-2">
                                <span className={`font-serif font-bold ${opt.hanzi === q.word.hanzi ? 'text-emerald-600' : 'text-slate-700'}`}>
                                  {opt.hanzi}
                                </span>
                                <span className="text-indigo-600">({opt.pinyin})</span>
                                <span className="text-slate-500">— {opt.meaning}</span>
                              </li>
                            ))}
                          </ul>
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          <button onClick={onRestart} className="w-full py-4 bg-indigo-600 text-white rounded-xl font-bold hover:bg-indigo-700 transition">
            🔄 Вернуться в главное меню
          </button>
        </div>
      );
    }

    // --- 4. ГЛАВНОЕ ПРИЛОЖЕНИЕ ---
    function App() {
      const [words, setWords] = useState([]);
      const [groups, setGroups] = useState([]);
      const [questions, setQuestions] = useState([]);
      const [currentIndex, setCurrentIndex] = useState(0);
      const [answers, setAnswers] = useState([]);
      const [mode, setMode] = useState('choice');
      const [isTraining, setIsTraining] = useState(false);
      const [isFinished, setIsFinished] = useState(false);

      const [hasActiveSession, setHasActiveSession] = useState(false);
      const [savedSessionInfo, setSavedSessionInfo] = useState(null);

      const loadData = async () => {
        let allWords = await db.words.toArray();
        if (allWords.length === 0) {
          const restored = await restoreFromLocalStorage();
          if (restored) allWords = await db.words.toArray();
        }

        setWords(allWords);

        const map = new Map();
        allWords.forEach((w) => {
          map.set(w.group, (map.get(w.group) || 0) + 1);
        });

        setGroups(Array.from(map.entries()).map(([name, count]) => ({ name, count })));
      };

      const checkActiveSession = () => {
        const raw = localStorage.getItem(ACTIVE_SESSION_KEY);
        if (raw) {
          try {
            const session = JSON.parse(raw);
            if (session && session.questions && session.questions.length > 0) {
              setHasActiveSession(true);
              setSavedSessionInfo(session);
            }
          } catch (e) {
            localStorage.removeItem(ACTIVE_SESSION_KEY);
          }
        }
      };

      useEffect(() => {
        loadData();
        checkActiveSession();
      }, []);

      // Генерация всех заданий (Правка 4 и Правка 5)
      const startTraining = async (groupName, selectedMode) => {
        const groupWords = groupName === 'all' ? words : words.filter((w) => w.group === groupName);
        if (groupWords.length === 0) return;

        const dbSentences = await db.sentences.toArray();
        let qList = [];

        if (selectedMode === 'writing') {
          qList = shuffleArray(groupWords).map((w) => ({ word: w, quizType: 'writing' }));
        } else {
          groupWords.forEach((word) => {
            // 1. Поиск всех предложений для текущего слова (Правка 4)
            const wordSentences = dbSentences.filter(
              (s) => s.wordId === word.id || (s.correctHanzi && s.correctHanzi.trim() === word.hanzi.trim())
            );

            // Создаем отдельный тест для КАЖДОГО предложения слова
            wordSentences.forEach((sentenceObj) => {
              const distractors = getDistractors(word, words);
              const options = shuffleArray([word, ...distractors]);
              qList.push({
                word,
                quizType: 'sentence',
                sentence: sentenceObj,
                options,
                distractors,
              });
            });

            // 2. Добавляем также тест с прямым выбором иероглифа для каждого слова (Правка 4)
            const distractors = getDistractors(word, words);
            const options = shuffleArray([word, ...distractors]);
            qList.push({
              word,
              quizType: 'choice',
              sentence: null,
              options,
              distractors,
            });
          });

          qList = shuffleArray(qList);
        }

        const sessionData = {
          groupId: groupName,
          mode: selectedMode,
          questions: qList,
          currentIndex: 0,
          answers: [],
          timestamp: Date.now(),
        };

        localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(sessionData));
        setQuestions(qList);
        setCurrentIndex(0);
        setAnswers([]);
        setMode(selectedMode);
        setHasActiveSession(false);
        setIsTraining(true);
        setIsFinished(false);
      };

      const resumeSession = () => {
        const raw = localStorage.getItem(ACTIVE_SESSION_KEY);
        if (!raw) return;
        try {
          const session = JSON.parse(raw);
          setQuestions(session.questions || []);
          setCurrentIndex(session.currentIndex || 0);
          setAnswers(session.answers || []);
          setMode(session.mode || 'choice');
          setIsTraining(true);
          setIsFinished(false);
          setHasActiveSession(false);
        } catch (e) {
          console.error('Ошибка загрузки сессии', e);
          localStorage.removeItem(ACTIVE_SESSION_KEY);
        }
      };

      const clearActiveSession = () => {
        localStorage.removeItem(ACTIVE_SESSION_KEY);
        setHasActiveSession(false);
        setSavedSessionInfo(null);
      };

      const handleAnswer = (userAns, isCorrect) => {
        const currentQ = questions[currentIndex];
        const newAnswer = {
          questionIndex: currentIndex,
          wordId: currentQ.word.id,
          userAnswer: userAns,
          isCorrect,
          isLocked: true,
        };

        const updatedAnswers = [...answers.filter((a) => a.questionIndex !== currentIndex), newAnswer];
        setAnswers(updatedAnswers);

        const currentSession = JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY) || '{}');
        if (currentSession.questions) {
          currentSession.answers = updatedAnswers;
          currentSession.currentIndex = currentIndex;
          localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(currentSession));
        }
      };

      const handleNextQuestion = () => {
        if (currentIndex + 1 < questions.length) {
          const nextIdx = currentIndex + 1;
          setCurrentIndex(nextIdx);

          const currentSession = JSON.parse(localStorage.getItem(ACTIVE_SESSION_KEY) || '{}');
          if (currentSession.questions) {
            currentSession.currentIndex = nextIdx;
            localStorage.setItem(ACTIVE_SESSION_KEY, JSON.stringify(currentSession));
          }
        } else {
          localStorage.removeItem(ACTIVE_SESSION_KEY);
          setIsFinished(true);
        }
      };

      const handlePrev = () => {
        if (currentIndex > 0) {
          setCurrentIndex(currentIndex - 1);
        }
      };

      const handleUploadWords = async (e) => {
        if (e.target.files?.[0]) {
          await parseWordsDocx(e.target.files[0]);
          await loadData();
          alert('Слова успешно загружены!');
        }
      };

      const handleUploadSentences = async (e) => {
        if (e.target.files?.[0]) {
          const count = await parseSentencesDocx(e.target.files[0]);
          alert(`Загружено предложений: ${count}`);
        }
      };

      if (!isTraining) {
        return (
          <GroupList
            groups={groups}
            words={words}
            hasActiveSession={hasActiveSession}
            savedSessionInfo={savedSessionInfo}
            onUploadWords={handleUploadWords}
            onUploadSentences={handleUploadSentences}
            onStartTraining={startTraining}
            onResumeSession={resumeSession}
            onClearSession={clearActiveSession}
            onExport={exportDataToJSON}
            onImport={async (e) => {
              if (e.target.files?.[0]) {
                await importDataFromJSON(e.target.files[0]);
                await loadData();
              }
            }}
          />
        );
      }

      if (isFinished) {
        return (
          <SessionSummary
            questions={questions}
            answers={answers}
            onRestart={() => {
              setIsTraining(false);
              setIsFinished(false);
              checkActiveSession();
            }}
          />
        );
      }

      const currentQuestion = questions[currentIndex];
      const savedAns = answers.find((a) => a.questionIndex === currentIndex);

      return (
        <div className="min-h-screen bg-slate-50 flex flex-col">
          {/* Шапка тренировки без кнопки "Назад" (Правка 2) */}
          <header className="bg-white border-b border-slate-100 px-4 py-3 flex items-center justify-between shadow-sm">
            <span className="text-xs font-bold text-slate-500">
              Вопрос {currentIndex + 1} из {questions.length}
            </span>

            <button onClick={() => { setIsTraining(false); checkActiveSession(); }} className="text-xs font-bold text-rose-500 hover:text-rose-600 transition">
              В главное меню
            </button>
          </header>

          <div className="w-full bg-slate-200 h-1">
            <div className="bg-indigo-600 h-1 transition-all duration-300" style={{ width: `${((currentIndex + 1) / questions.length) * 100}%` }} />
          </div>

          <main className="flex-1 p-4 flex items-center justify-center">
            {mode === 'writing' ? (
              <WritingQuiz
                question={currentQuestion}
                isLocked={savedAns?.isLocked || false}
                savedAnswer={savedAns?.userAnswer}
                onAnswer={(ans, isCorrect) => handleAnswer(ans, isCorrect)}
                onSkip={() => { handleAnswer('skip', false); handleNextQuestion(); }}
                onNext={handleNextQuestion}
                onPrev={handlePrev}
                isFirstQuestion={currentIndex === 0}
              />
            ) : (
              <MemorizationQuiz
                question={currentQuestion}
                isLocked={savedAns?.isLocked || false}
                savedAnswer={savedAns?.userAnswer}
                onAnswer={(ans, isCorrect) => handleAnswer(ans, isCorrect)}
                onSkip={() => { handleAnswer('skip', false); handleNextQuestion(); }}
                onNext={handleNextQuestion}
                onPrev={handlePrev}
                isFirstQuestion={currentIndex === 0}
              />
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
